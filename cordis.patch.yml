- insert:
    - id: chaoxing-assistant
      name: "dsh-chaoxing-assistant"
      config:
        # 面板与宿主的本地 HTTP 桥端口（只监听 127.0.0.1）
        uiPort: 9483
        # 插件启用时（DSH 启动）不自动运行，必须点面板「开始」或调用 chaoxing_auto start
        autoStart: false
        autoAccount: default
        # 0 = 停止后永不自动恢复 / 永不自动重扫
        autoResumeMinutes: 0
        autoRepeatMinutes: 0
        auto:
          account: default
          concurrency: 2
          maxMinutes: 180
          solveQuizzes: true
          solveWorks: true
          minConfidence: 0.75
          autoSubmit: true
          dryRun: false
          # 允许提交的空白题数上限：0=只要还有空题就存草稿不交卷（防止低分卷）
          maxBlanks: 0
          # 连续多少个视频「播放器放完但平台未确认完成」就停机（0=不检查）
          videoNotConfirmedMax: 3
          # 交卷前回读页面空题数：题数与抓到的题一致时以页面为准，否则退回答案计划
          blankGuard: true
          # 出现人脸/活体/实人认证提示就停机，零点击、不尝试绕过
          humanGuard: true
          # 任务页默认在当前窗口开标签（不会每开一个节点就弹新窗口）；
          # 如果某门课的视频一直不推进，可以改成 true 让每个任务页独立开窗口
          taskWindow: false
        # 临时数据自动清理：点「停止」立即清；没点停止则超过 ttlHours 自动清。
        # 只清任务日志/验证码/截图/桌面临时文件，不碰登录态、字体和账号/答案缓存。
        cleanup:
          enabled: true
          ttlHours: 24
          intervalMinutes: 30
